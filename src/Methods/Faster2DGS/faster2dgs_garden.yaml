GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
    - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: Faster2DGS
    DATASET_TYPE: MipNeRF360
MODEL:
    SH_DEGREE: 3
RENDERER:
    SCALE_MODIFIER: 1.0
    PROPER_ANTIALIASING: false
    FORCE_OPTIMIZED_INFERENCE: false
TRAINING:
    MODEL_NAME: faster2dgs_garden
    NUM_ITERATIONS: 30_000
    DATA:
        PRELOADING_LEVEL: 2
        FIELDS: ['rgb', 'alpha']
    LOSS:
        LAMBDA_L1: 0.8
        LAMBDA_DSSIM: 0.2
        LAMBDA_DISTORTION: 0.0
        LAMBDA_NORMAL: 0.0
        LAMBDA_PLANAR_SPLAT: 0.0
        LAMBDA_OPACITY_REGULARIZATION: 0.0
        LAMBDA_SCALE_REGULARIZATION: 0.0
DATASET:
    PATH: dataset/mipnerf360/garden
    IMAGE_SCALE_FACTOR: 0.25
