GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
    - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: Faster2DGS
    DATASET_TYPE: NeRF
MODEL:
    SH_DEGREE: 3

RENDERER:
    SCALE_MODIFIER: 1.0
    PROPER_ANTIALIASING: false
    FORCE_OPTIMIZED_INFERENCE: false
    # Faster2DGSRenderer — surfel path uses Faster2DGSCudaBackend; set false to use FasterGS diff_rasterize_with_aux only.
    REQUIRE_TRUE_2DGS_KERNEL: false

TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: lego_2DGS
    NUM_ITERATIONS: 30_000
    RUN_VALIDATION: false
    DATA:
        PRELOADING_LEVEL: 2
        FIELDS: ['rgb', 'alpha']
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: true
        RENDER_TESTSET: true
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: true
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    TIMING:
        ACTIVATE: false
        INCLUDE_DATALOADING_IN_TOTAL: true
        INCLUDE_PRETRAINING_IN_TOTAL: true
        INCLUDE_POSTTRAINING_IN_TOTAL: false
    WANDB:
        ACTIVATE: false
        ENTITY: null
        PROJECT: nerficg
        LOG_IMAGES: true
        INDEX_VALIDATION: -1
        INDEX_TRAINING: -1
        INTERVAL: 1000
        SWEEP_MODE:
            ACTIVE: false
            START_ITERATION: 999
            ITERATION_STRIDE: 1000
            NUM_IMAGES: -1
    WRITE_VRAM_STATS: false
    GUI:
        ACTIVATE: true
        RENDER_INTERVAL: 5
        GUI_STATUS_ENABLED: true
        GUI_STATUS_INTERVAL: 20
        SKIP_GUI_SETUP: false
        FPS_ROLLING_AVERAGE_SIZE: 100

    DENSIFICATION_START_ITERATION: 600
    DENSIFICATION_END_ITERATION: 8_000 #14_900
    DENSIFICATION_INTERVAL: 200 #100
    DENSIFICATION_GRAD_THRESHOLD: 0.0004 #0.0002
    DISTORTION_START_ITERATION: 5_000
    NORMAL_START_ITERATION: 10_000
    PLANAR_SPLAT_START_ITERATION: 7_000
    GEOMETRY_WARMUP_DURATION: 5_000
    DENSIFICATION_PERCENT_DENSE: 0.01
    USE_MCMC: false
    MAX_PRIMITIVES: 1_000_000
    OPACITY_RESET_INTERVAL: 3_000
    EXTRA_OPACITY_RESET_ITERATION: 500
    MORTON_ORDERING_INTERVAL: 5_000
    MORTON_ORDERING_END_ITERATION: 15_000
    FILTER_3D:
        USE: false
        ORIGINAL_FORMULATION: false
        FILTER_VARIANCE: 0.2
    USE_RANDOM_BACKGROUND_COLOR: false
    RANDOM_BACKGROUND_IF_ALPHA_OR_MASK: false
    EXTERNAL_MASKS_PATH: null
    NORMALIZE_LOSS_BY_MASK_AREA: true
    MIN_OPACITY_AFTER_TRAINING: 0.00392156862745098
    RANDOM_INITIALIZATION:
        FORCE: false
        N_POINTS: 100_000
        ENABLE_CARVING: true
        CARVING_IN_ALL_FRUSTUMS: false
        CARVING_ENFORCE_ALPHA: false

    # Faster2DGSLoss — tune after watching scales (distortion/normal magnitudes vary by scene).
    LOSS:
        LAMBDA_L1: 0.8
        LAMBDA_DSSIM: 0.2
        LAMBDA_DISTORTION: 0.0002
        LAMBDA_NORMAL: 0.001
        LAMBDA_PLANAR_SPLAT: 0.005
        LAMBDA_OPACITY_REGULARIZATION: 0.0
        LAMBDA_SCALE_REGULARIZATION: 0.0

    OPTIMIZER:
        LEARNING_RATE_MEANS_INIT: 0.00016
        LEARNING_RATE_MEANS_FINAL: 1.6e-06
        LEARNING_RATE_MEANS_MAX_STEPS: 30_000
        LEARNING_RATE_SH_COEFFICIENTS_0: 0.0025
        LEARNING_RATE_SH_COEFFICIENTS_REST: 0.000125
        LEARNING_RATE_OPACITIES: 0.025
        LEARNING_RATE_SCALES: 0.005
        LEARNING_RATE_ROTATIONS: 0.001

DATASET:
    PATH: /home/alex/Simulon/data/SfM/lego/datasets/lego
    IMAGE_SCALE_FACTOR: 1 #0.25
    NORMALIZE_CUBE: null
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR:
        - 0.0
        - 0.0
        - 0.0
    NEAR_PLANE: 0.01
    FAR_PLANE: 100.0
    TEST_STEP: 8
    APPLY_PCA: true
    APPLY_PCA_RESCALE: false
