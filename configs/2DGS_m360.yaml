# Faster2DGS — photometric preset (M360 PSNR parity, official m360_eval.py).
#
# λ_dist=0, depth_ratio=0 — best novel-view RGB; NOT for mesh export.
# Mesh / TSDF / bounded geometry → configs/2DGS_mesh.yaml
#
# MipNeRF360 resolution (official image folders):
#   outdoor → IMAGE_SCALE_FACTOR=0.25  (images_4)
#   indoor  → IMAGE_SCALE_FACTOR=0.5   (images_2)
#
# Examples:
#   python scripts/train.py -c configs/2DGS_m360.yaml \
#       DATASET.PATH=dataset/mipnerf360/kitchen DATASET.IMAGE_SCALE_FACTOR=0.5
#   python scripts/train.py -c configs/2DGS_m360.yaml \
#       GLOBAL.DATASET_TYPE=Colmap \
#       'DATASET.PATH=livingroom_take2/undistort' DATASET.IMAGE_SCALE_FACTOR=0.5

GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
        - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: Faster2DGS
    DATASET_TYPE: MipNeRF360

MODEL:
    SH_DEGREE: 3
    PPISP:
        USE: false
        CONTROLLER_TRAINING_STEPS: 5_000
        CONTROLLER_DISTILLATION: true

RENDERER:
    SCALE_MODIFIER: 1.0
    PROPER_ANTIALIASING: false
    FORCE_OPTIMIZED_INFERENCE: false
    REQUIRE_TRUE_2DGS_KERNEL: false
    DEPTH_RATIO: 0.0

TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: faster2dgs_m360
    NUM_ITERATIONS: 30_000
    RUN_VALIDATION: false
    DATA:
        PRELOADING_LEVEL: 1
        FIELDS: ['rgb', 'alpha']
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: true
        RENDER_TESTSET: true
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: true
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    WANDB:
        ACTIVATE: false
    TIMING:
        ACTIVATE: false
    GUI:
        ACTIVATE: false
        RENDER_INTERVAL: 5
        SKIP_GUI_SETUP: true

    DENSIFICATION_START_ITERATION: 500
    DENSIFICATION_END_ITERATION: 15_000
    DENSIFICATION_INTERVAL: 100
    DENSIFICATION_GRAD_THRESHOLD: 0.0002
    DENSIFICATION_PERCENT_DENSE: 0.01
    DENSIFICATION_OPACITY_CULL: 0.05
    DENSIFICATION_MAX_SCREEN_SIZE: 20
    SKIP_FINAL_OPACITY_PRUNE: true
    DISTORTION_START_ITERATION: 3_000
    NORMAL_START_ITERATION: 7_000
    DEPTH_SMOOTHNESS_START_ITERATION: 7_000
    PLANAR_SPLAT_START_ITERATION: 7_000
    OPACITY_RESET_MAX: 0.01
    GEOMETRY_LOG_INTERVAL: 10
    USE_MCMC: false
    OPACITY_RESET_INTERVAL: 3_000
    EXTRA_OPACITY_RESET_ITERATION: 500
    MORTON_ORDERING_INTERVAL: 5_000
    MORTON_ORDERING_END_ITERATION: 15_000
    FILTER_3D:
        USE: false
    USE_RANDOM_BACKGROUND_COLOR: false
    RANDOM_BACKGROUND_IF_ALPHA_OR_MASK: true
    NORMALIZE_LOSS_BY_MASK_AREA: true
    MIN_OPACITY_AFTER_TRAINING: 0.05

    LOSS:
        LAMBDA_L1: 0.8
        LAMBDA_DSSIM: 0.2
        LAMBDA_DISTORTION: 0.0
        LAMBDA_NORMAL: 0.05
        LAMBDA_DEPTH_SMOOTHNESS: 0.0
        LAMBDA_PLANAR_SPLAT: 0.0
        LAMBDA_OPACITY_REGULARIZATION: 0.0
        LAMBDA_SCALE_REGULARIZATION: 0.0

    OPTIMIZER:
        LEARNING_RATE_MEANS_INIT: 0.00016
        LEARNING_RATE_MEANS_FINAL: 1.6e-06
        LEARNING_RATE_MEANS_MAX_STEPS: 30_000
        LEARNING_RATE_SH_COEFFICIENTS_0: 0.0025
        LEARNING_RATE_SH_COEFFICIENTS_REST: 0.000125
        LEARNING_RATE_OPACITIES: 0.05
        LEARNING_RATE_SCALES: 0.005
        LEARNING_RATE_ROTATIONS: 0.001

DATASET:
    PATH: dataset/mipnerf360/kitchen
    IMAGE_SCALE_FACTOR: 0.5
    NORMALIZE_CUBE: null
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR:
        - 0.0
        - 0.0
        - 0.0
    NEAR_PLANE: 0.01
    FAR_PLANE: 100.0
    TEST_STEP: 8
    APPLY_PCA: false
    APPLY_PCA_RESCALE: false
