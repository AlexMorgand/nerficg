# NeRFICG Faster2DGS — default template aligned with hbb1/2d-gaussian-splatting.
#
# Usage:
#   cp configs/2DGS_default.yaml configs/my_scene.yaml
#   # edit DATASET.PATH, MODEL_NAME, DATASET_TYPE, and scene preset below
#   python scripts/train.py -c configs/my_scene.yaml
#
# Requires: python scripts/install.py -m Faster2DGS
#
# Scene presets (2DGS paper / README):
#   Unbounded (MipNeRF360 outdoor):  DATASET_TYPE: MipNeRF360, DEPTH_RATIO: 0.0, LAMBDA_DISTORTION: 100
#   Bounded (DTU / COLMAP object):   DATASET_TYPE: Colmap,       DEPTH_RATIO: 1.0, LAMBDA_DISTORTION: 1000
# If RGB blurs with distortion on, reduce LAMBDA_DISTORTION or set to 0 (official code default).

GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
        - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: Faster2DGS
    # Colmap | MipNeRF360 | NeRF | ...
    DATASET_TYPE: Colmap

MODEL:
    SH_DEGREE: 3

RENDERER:
    SCALE_MODIFIER: 1.0
    PROPER_ANTIALIASING: false
    FORCE_OPTIMIZED_INFERENCE: false
    REQUIRE_TRUE_2DGS_KERNEL: false
    # 0 = mean depth (outdoor / unbounded), 1 = median depth (bounded / mesh export)
    DEPTH_RATIO: 1.0
    # GUI debug: extra "splats" output (uniform opacity); enable in Advanced → Include Splat Debug
    INCLUDE_SPLAT_DEBUG: false
    SPLAT_DEBUG_UNIFORM_OPACITY: 1.0

TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: faster2dgs_scene
    NUM_ITERATIONS: 30_000
    RUN_VALIDATION: false
    DATA:
        PRELOADING_LEVEL: 2
        FIELDS: ['rgb', 'alpha']
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: true
        RENDER_TESTSET: true
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: true
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    WANDB:
        ACTIVATE: false
    GUI:
        ACTIVATE: false
        RENDER_INTERVAL: 5
        GUI_STATUS_ENABLED: true
        GUI_STATUS_INTERVAL: 20
        SKIP_GUI_SETUP: true
        FPS_ROLLING_AVERAGE_SIZE: 100

    # Official 2DGS OptimizationParams + train.py geometry schedule
    DENSIFICATION_START_ITERATION: 500
    DENSIFICATION_END_ITERATION: 15_000
    DENSIFICATION_INTERVAL: 100
    DENSIFICATION_GRAD_THRESHOLD: 0.0002
    DENSIFICATION_PERCENT_DENSE: 0.01
    # Opacity reset @3k; distortion @3k; normal @7k per official train.py.
    DISTORTION_START_ITERATION: 3_000
    NORMAL_START_ITERATION: 7_000
    DEPTH_SMOOTHNESS_START_ITERATION: 7_000
    PLANAR_SPLAT_START_ITERATION: 7_000
    OPACITY_RESET_MAX: 0.01
    GEOMETRY_LOG_INTERVAL: 10
    USE_MCMC: false
    OPACITY_RESET_INTERVAL: 3_000
    EXTRA_OPACITY_RESET_ITERATION: 500
    MORTON_ORDERING_INTERVAL: 5_000
    MORTON_ORDERING_END_ITERATION: 15_000
    FILTER_3D:
        USE: false
        ORIGINAL_FORMULATION: false
        FILTER_VARIANCE: 0.2
    USE_RANDOM_BACKGROUND_COLOR: false
    RANDOM_BACKGROUND_IF_ALPHA_OR_MASK: true
    EXTERNAL_MASKS_PATH: null
    NORMALIZE_LOSS_BY_MASK_AREA: true
    MIN_OPACITY_AFTER_TRAINING: 0.05
    RANDOM_INITIALIZATION:
        FORCE: false
        N_POINTS: 100_000
        ENABLE_CARVING: true
        CARVING_IN_ALL_FRUSTUMS: false
        CARVING_ENFORCE_ALPHA: false

    LOSS:
        LAMBDA_L1: 0.8
        LAMBDA_DSSIM: 0.2
        # Paper α (distortion): 1000 bounded, 100 unbounded; code default 0
        LAMBDA_DISTORTION: 1000.0
        # Paper β (normal consistency)
        LAMBDA_NORMAL: 0.05
        # NeRFICG Phase D optional; 0 to disable
        LAMBDA_DEPTH_SMOOTHNESS: 0.01
        LAMBDA_PLANAR_SPLAT: 0.0
        LAMBDA_OPACITY_REGULARIZATION: 0.0
        LAMBDA_SCALE_REGULARIZATION: 0.0

    OPTIMIZER:
        LEARNING_RATE_MEANS_INIT: 0.00016
        LEARNING_RATE_MEANS_FINAL: 1.6e-06
        LEARNING_RATE_MEANS_MAX_STEPS: 30_000
        LEARNING_RATE_SH_COEFFICIENTS_0: 0.0025
        LEARNING_RATE_SH_COEFFICIENTS_REST: 0.000125
        LEARNING_RATE_OPACITIES: 0.05
        LEARNING_RATE_SCALES: 0.005
        LEARNING_RATE_ROTATIONS: 0.001

DATASET:
    PATH: dataset/your_scene
    IMAGE_SCALE_FACTOR: 1.0
    NORMALIZE_CUBE: null
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR:
        - 0.0
        - 0.0
        - 0.0
    NEAR_PLANE: 0.01
    FAR_PLANE: 100.0
    TEST_STEP: 8
    APPLY_PCA: true
    APPLY_PCA_RESCALE: false
