GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES:
    - 0
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: FasterGS
    DATASET_TYPE: Colmap
MODEL:
    SH_DEGREE: 3
    PPISP:
        USE: false
        CONTROLLER_TRAINING_STEPS: 5_000
        CONTROLLER_DISTILLATION: true
    DEFERRED_REFLECTION:
        USE: true
        REFL_INIT_VALUE: 0.001
        ENVMAP_RESOLUTION: 256
        MESH_NORMAL_HIJACK: false
        ENVMAP_HDRI: null
        ENVMAP_EXPOSURE: 1.0
        ENVMAP_YAW_DEG: 0.0
        ENVMAP_ROLL_DEG: 0.0
        FREEZE_ENVMAP: false
        ENVMAP_ANCHOR_LAMBDA: 0.1
RENDERER:
    SCALE_MODIFIER: 1.0
    PROPER_ANTIALIASING: false
    FORCE_OPTIMIZED_INFERENCE: false
TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: fastergs_dr_fal_placeholder
    NUM_ITERATIONS: 8_000
    RUN_VALIDATION: true
    INITIALIZATION_GAUSSIAN_PLY_PATH: null
    FREEZE_INITIAL_GAUSSIAN_GEOMETRY: false
    KEEP_THIN_SPLATS: true
    ENABLE_DENSIFICATION_WITH_GAUSSIAN_PLY_INIT: true
    DATA:
        PRELOADING_LEVEL: 2
        FIELDS: ['rgb', 'segmentation']
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: true
        RENDER_TESTSET: true
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: false
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    TIMING:
        ACTIVATE: false
    WANDB:
        ACTIVATE: false
    WRITE_VRAM_STATS: false
    GUI:
        ACTIVATE: false
        SKIP_GUI_SETUP: true
    DENSIFICATION_START_ITERATION: 500
    DENSIFICATION_END_ITERATION: 8_000
    DENSIFICATION_INTERVAL: 100
    DENSIFICATION_GRAD_THRESHOLD: 0.0002
    DENSIFICATION_PERCENT_DENSE: 0.01
    USE_MCMC: false
    OPACITY_RESET_INTERVAL: 3_000
    EXTRA_OPACITY_RESET_ITERATION: 500
    MORTON_ORDERING_INTERVAL: 5_000
    MORTON_ORDERING_END_ITERATION: 8_000
    USE_RANDOM_BACKGROUND_COLOR: true
    RANDOM_BACKGROUND_IF_ALPHA_OR_MASK: true
    WHITE_BACKGROUND: false
    MIN_OPACITY_AFTER_TRAINING: 0.00392156862745098
    RANDOM_INITIALIZATION:
        FORCE: false
        IGNORE_GAUSSIAN_PLY: false
        N_POINTS: 100_000
        ENABLE_CARVING: true
        CARVING_IN_ALL_FRUSTUMS: false
        CARVING_ENFORCE_ALPHA: false
    LOSS:
        LAMBDA_L1: 0.8
        LAMBDA_DSSIM: 0.2
        LAMBDA_OPACITY_REGULARIZATION: 0.0
        LAMBDA_SCALE_REGULARIZATION: 0.0
        LAMBDA_NORMAL: 0.0
        LAMBDA_ENVMAP_ANCHOR: 0.1
        NORMAL_LOSS_UNTIL_ITERATION: 0
    OPTIMIZER:
        LEARNING_RATE_MEANS_INIT: 0.00016
        LEARNING_RATE_MEANS_FINAL: 1.6e-06
        LEARNING_RATE_MEANS_MAX_STEPS: 8_000
        LEARNING_RATE_SH_COEFFICIENTS_0: 0.0025
        LEARNING_RATE_SH_COEFFICIENTS_REST: 0.000125
        LEARNING_RATE_OPACITIES: 0.05
        LEARNING_RATE_SCALES: 0.005
        LEARNING_RATE_ROTATIONS: 0.001
        LEARNING_RATE_REFLECTION_STRENGTH: 0.006
    DEFERRED_REFLECTION_SCHEDULE:
        INIT_UNTIL_ITERATION: 3_000
        PROPAGATION_INTERVAL: 1_000
        PROPAGATION_END_ITERATION: 8_000
        LONGER_PROPAGATION_ITERATIONS: 0
        PROPAGATION_ENLARGE_SCALE: 1.5
        PROPAGATION_MIN_OPACITY: 0.9
        PROPAGATION_OPACITY_FLOOR: 0.01
        PROPAGATION_MIN_REFLECTION: 0.001
        SCALE_ENLARGE_THRESHOLD: 0.02
        COLOR_SABOTAGE_THRESHOLD: 0.05
        REFLECTION_THRESHOLD: 0.1
        COLOR_SABOTAGE_NOISE: 0.4
        SPECULAR_TERMINATION_PATIENCE: 0
        OPAC_LR0_INTERVAL: 200
        ENVMAP_LEARNING_RATE: 0.01
        DENSIFICATION_INTERVAL_DURING_PROPAGATION: 500
DATASET:
    PATH: /path/to/pack
    IMAGE_FOLDER: images
    EXTERNAL_MASKS_PATH: /path/to/pack/masks_vitmatte
    EXTERNAL_NORMALS_PATH: null
    EXTERNAL_MASKS_BINARY: false
    IMAGE_SCALE_FACTOR: 1
    TEST_STEP: 8
    NORMALIZE_CUBE: null
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR:
    - 0.0
    - 0.0
    - 0.0
    NEAR_PLANE: 0.01
    FAR_PLANE: 100.0
    APPLY_PCA: true
    APPLY_PCA_RESCALE: false
    TURNTABLE:
        ENABLED: true
        REFERENCE_FRAME_IDX: 0
